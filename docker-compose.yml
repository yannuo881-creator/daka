services:
  backend:
    build: ./backend
    container_name: medication-backend
    restart: unless-stopped
    ports:
      - "3000:3000" # Exposing backend directly is optional, but helpful for debugging
    volumes:
      - medication-data:/app/data
    environment:
      - PORT=3000
      - DB_PATH=/app/data/medication.db
      - TZ=Asia/Shanghai

  frontend:
    build: ./frontend
    container_name: medication-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:80"     # Map host port 8080 to frontend Nginx container port 80
    depends_on:
      - backend

volumes:
  medication-data:
    name: medication-data-volume
